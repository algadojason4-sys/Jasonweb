<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <video class="vbg" autoplay muted loop playinline>
    <source src="Tiktokphoto.mp4">
  </video>
  

  <h1> Contact me at</h1>

   <button class="btn" onclick="window.history.back()">Back</button>

  <section class="container">


  <div class="box">
    <h2><i class="fa-solid fa-phone"></i></h2>
    <p> 09750389029</p>
  </div>

  <div class="box">
    <h2><i class="fa-brands fa-facebook"></i></h2>
    <p> Algado Jason</p>
  </div>

  <div class="box">
    <h3><i class="fa-solid fa-envelope"></i></h3>
    <p>algadojason4@gmail.com</p>
  </div>
  </section>
</body>

<style>
  body{
    margin: 0;
    padding: 0;
  }

  .vbg{
    top: 0;
    height: 100%;
    width: 100%;
    position: fixed;
    object-fit: cover;
    z-index: -1;

  }

  .container{
    display: flex;
    background-color: transparent;
    padding: 20px;
    margin: 70px;
    margin-left: 22%;
    position: fixed;
    flex-wrap: wrap;

  }

  .box{
    color: white;
    background-color: transparent;
    border-radius: 20px;
    padding: 70px;
    margin: 10px;
    margin-top: 25%;
    text-align: center;
    box-shadow: 4px 6px 30px black;
    
  }

  .box:hover{
    transform: scale(1.2);
    transition: 0.5s;
    }

  h1{
    text-align: center;
    color: transparent;
    text-shadow: 3px 5px 3px black, 2px 3px 3px white;
    font-size: 42px;
    font-weight: 900;
  }

  i{
    color: white;
  }

  button{
    margin-left: 48%;
    width: 80px;
    padding: 10px;

    border-radius: 20px;
    border: 1px solid black;
    background: transparent;
    box-shadow: 1px 3px 30px black;
  }

  button:hover{
    transform: scale(1.2);
    transition: 0.3s;
  }

  .btn{
    font-size: 18px;
    font-weight: 700;
    text-shadow: 2px 3px 11px black;
  }

  @media(max-width: 789px){

    .container{
      margin: 0;
    }
    .box{
      padding: 70px;
      margin-left: 60px;
      height: 0;
      gap: 20px;

      display: flex;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      flex-wrap: wrap;

    }

  }

</style>
</html>
